# Python tooling for the repository: the playbook's scripts in playbook/bin (standard library
# only). Run them with `uv run playbook/bin/<script>.py`; uv fetches a matching interpreter
# when the machine has none. This is tooling, not a library, so nothing is built or installed.
[project]
name = "refspec-tooling"
version = "0.0.0"
description = "Playbook scripts for the Quire repository"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
